name: roofinity
description: "Real-estate marketplace that blocks AI-generated property photos with an on-device TFLite model."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1
  image_picker: ^1.1.2
  cloudinary_public: ^0.23.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3
  path: ^1.9.0
  photo_view: ^0.15.0
  tflite_flutter: ^0.12.1
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  rename_app: ^1.4.0
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/roofinity_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/false_property_detector.tflite
